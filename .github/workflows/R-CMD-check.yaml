# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Help: https://github.com/r-lib/actions/tree/v2/setup-r-dependencies#readme
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

name: R-CMD-check.yaml

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}
    timeout-minutes: 45

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest,  r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest,  r: 'release', manual: true}
          - {os: ubuntu-latest,  r: 'oldrel-1'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      NOT_CRAN: true
      _R_CHECK_FORCE_SUGGESTS_: 'true'
      _R_CHECK_CRAN_INCOMING_: 'true'

    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::rcmdcheck
            any::pkgload
            ${{ matrix.config.manual && 'any::V8' || '' }}
          needs: check

      - name: Install HTML validation tools
        if: matrix.config.manual == true
        run: |
          sudo apt-get update
          sudo apt-get install -y tidy

      - uses: r-lib/actions/setup-tinytex@v2
        if: matrix.config.manual == true

      - name: Install manual fonts
        if: matrix.config.manual == true
        run: |
          tlmgr update --self
          tlmgr install inconsolata

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          upload-results: true
          build_args: ${{ matrix.config.manual && 'character()' || '"--no-manual"' }}
          args: ${{ matrix.config.manual && 'c("--as-cran", "--run-donttest")' || 'c("--no-manual", "--as-cran", "--run-donttest")' }}
          # Version 2 treats warnings as release blockers.
          error-on: '"warning"'

      # The published-plan fixtures are local-only (not in the repository), so
      # the tests that read them are skipped here and run in the maintainer's
      # local pre-release run.
      - name: Run the complete test suite from the source tree
        shell: Rscript {0}
        run: testthat::test_local(".", load_package = "source", stop_on_failure = TRUE)

      - name: Build and check the exact CRAN submission archive
        if: matrix.config.manual == true
        shell: bash
        run: |
          mkdir -p cran_submission/ci
          cd cran_submission/ci
          R CMD build ../..
          R CMD check --as-cran --run-donttest mediaPlanR_2.0.0.tar.gz
          if grep -Eq '^Status:.*(ERROR|WARNING)' mediaPlanR.Rcheck/00check.log; then
            exit 1
          fi
          sha256sum mediaPlanR_2.0.0.tar.gz > SHA256SUMS

      - name: Preserve the submission archive and its check log
        if: always() && matrix.config.manual == true
        uses: actions/upload-artifact@v4
        with:
          name: CRAN-submission-${{ github.sha }}
          path: |
            cran_submission/ci/mediaPlanR_2.0.0.tar.gz
            cran_submission/ci/SHA256SUMS
            cran_submission/ci/mediaPlanR.Rcheck/00check.log
            cran_submission/ci/mediaPlanR.Rcheck/mediaPlanR-manual.pdf

      - name: Publish check logs for NOTE review
        if: always()
        shell: Rscript {0}
        run: |
          logs <- list.files("check", "00check[.]log$", recursive = TRUE, full.names = TRUE)
          logs <- c(logs, list.files("cran_submission/ci", "00check[.]log$",
                                    recursive = TRUE, full.names = TRUE))
          summary <- Sys.getenv("GITHUB_STEP_SUMMARY")
          for (log in logs) {
            cat("\n### ", log, "\n\n```text\n", paste(readLines(log, warn = FALSE), collapse = "\n"),
                "\n```\n", file = summary, append = TRUE, sep = "")
          }
          cat("\nReview every NOTE before submission; a green job does not clear NOTEs.\n",
              file = summary, append = TRUE)

  minimum-R:
    runs-on: ubuntu-latest
    name: R 4.0.5 base-dependency compatibility
    steps:
      - uses: actions/checkout@v7
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.0.5'
      - run: R CMD INSTALL .
      - run: Rscript --vanilla tools/check-minimum-r.R
