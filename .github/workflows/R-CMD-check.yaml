# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Help: https://github.com/r-lib/actions/tree/v2/setup-r-dependencies#readme
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

name: R-CMD-check.yaml

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}
    timeout-minutes: 45

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest,  r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest,  r: 'release', manual: true}
          - {os: ubuntu-latest,  r: 'oldrel-1'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      NOT_CRAN: true
      _R_CHECK_FORCE_SUGGESTS_: 'true'
      _R_CHECK_CRAN_INCOMING_: 'true'

    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::rcmdcheck
            any::pkgload
            ${{ matrix.config.manual && 'any::V8' || '' }}
          needs: check

      - name: Install HTML validation tools
        if: matrix.config.manual == true
        run: |
          sudo apt-get update
          sudo apt-get install -y tidy

      - uses: r-lib/actions/setup-tinytex@v2
        if: matrix.config.manual == true

      - name: Install manual fonts
        if: matrix.config.manual == true
        run: tlmgr install inconsolata

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          upload-results: true
          build_args: ${{ matrix.config.manual && 'character()' || '"--no-manual"' }}
          args: ${{ matrix.config.manual && 'c("--as-cran", "--run-donttest")' || 'c("--no-manual", "--as-cran", "--run-donttest")' }}
          # Version 2 treats warnings as release blockers.
          error-on: '"warning"'

      - name: Run the complete test suite from the source tree
        shell: Rscript {0}
        run: testthat::test_local(".", load_package = "source", stop_on_failure = TRUE)

      - name: Publish check logs for NOTE review
        if: always()
        shell: Rscript {0}
        run: |
          logs <- list.files("check", "00check[.]log$", recursive = TRUE, full.names = TRUE)
          summary <- Sys.getenv("GITHUB_STEP_SUMMARY")
          for (log in logs) {
            cat("\n### ", log, "\n\n```text\n", paste(readLines(log, warn = FALSE), collapse = "\n"),
                "\n```\n", file = summary, append = TRUE, sep = "")
          }
          cat("\nReview every NOTE before submission; a green job does not clear NOTEs.\n",
              file = summary, append = TRUE)

  minimum-R:
    runs-on: ubuntu-latest
    name: R 4.0.5 base-dependency compatibility
    steps:
      - uses: actions/checkout@v7
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.0.5'
      - run: R CMD INSTALL .
      - run: Rscript --vanilla tools/check-minimum-r.R
